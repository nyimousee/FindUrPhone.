<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find My Device - iOS Style</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    margin:0;
    font-family:-apple-system;
    background:#f2f2f7;
}

/* LOGIN */
#login {
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:white;
}

.box {
    width:300px;
    text-align:center;
}

input {
    width:100%;
    padding:12px;
    margin:5px 0;
    border-radius:10px;
    border:1px solid #ccc;
}

button {
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#007aff;
    color:white;
}

/* MAP */
#map {
    height:100vh;
    display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
    <div class="box">
        <h2>Find My Device</h2>
        <input id="name" placeholder="Masukkan Nama">
        <button onclick="start()">Masuk</button>
    </div>
</div>

<!-- MAP -->
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let map, marker;

// START APP
function start(){
    document.getElementById("login").style.display="none";
    document.getElementById("map").style.display="block";
    
    initMap();
    trackLocation();
}

// INIT MAP
function initMap(){
    map = L.map('map').setView([-6.2,106.8], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map'
    }).addTo(map);

    marker = L.marker([-6.2,106.8]).addTo(map);
}

// TRACK USER LOCATION (REAL-TIME)
function trackLocation(){
    if(navigator.geolocation){
        navigator.geolocation.watchPosition(pos=>{
            
            let lat = pos.coords.latitude;
            let lon = pos.coords.longitude;

            marker.setLatLng([lat,lon]);
            map.setView([lat,lon],16);

        }, err=>{
            alert("Aktifkan GPS ya!");
        },{
            enableHighAccuracy:true
        });
    }
}
</script>

</body>
</html>
